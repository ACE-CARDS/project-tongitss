services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: project_tongitss
    ports:
      - "5432:5432"

  minio:
    image: bitnami/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: admin_access_key
      MINIO_ROOT_PASSWORD: admin_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"