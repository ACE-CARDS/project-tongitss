# Infra services always run. 'app' and 'caddy' only run with: docker compose --profile prod up -d --build
name: tongitss

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tongitss
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tongitss"]
      interval: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:latest    # pin an explicit version tag before production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/tongitss
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
    ports:
      - "127.0.0.1:3001:3000"

  minio:
    image: minio/minio:latest            # check image availability and pin a version (see guide)
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  app:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_ORIGIN}
        NEXT_PUBLIC_FILES_URL: ${FILES_BASE_URL}
    restart: unless-stopped
    depends_on:
      - postgres
      - postgrest
      - minio
    environment:
      BETTER_AUTH_URL: ${APP_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/tongitss
      POSTGREST_URL: http://postgrest:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${FILES_BASE_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NEXT_PUBLIC_FILES_URL: ${FILES_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

  caddy:
    profiles: ["prod"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  miniodata:
  caddydata:
